[package]
name = "cps-desktop"
version = "0.1.0"
description = "Desktop frontend for Codex Provider Switcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "cps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cps = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
